<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zammad SPsync — Debug</title>
  <!-- Inlined CSS — UI Kit injected automatically (see docs/plugin-development.md) -->
  <style>
    body { padding: var(--s3); max-width: 560px; margin: 0 auto; }
    .card { padding: var(--s3); margin-bottom: var(--s3); }
    .row { display: flex; gap: var(--s); align-items: end; margin-bottom: var(--s2); }
    .row > * { flex: 1; }
    #log { white-space: pre-wrap; font-family: monospace; font-size: 12px; background: var(--bg-darker); padding: var(--s2); border-radius: var(--card-border-radius); max-height: 240px; overflow: auto; }
    .muted { color: var(--text-color-muted); font-size: 13px; }
  </style>
</head>
<body>
  <h1>Zammad SPsync — Debug</h1>
  <p class="muted">Phase 0 scaffold — <span id="ver">0.1.5</span> · Token est <strong>local-only</strong> (<code>setSecret</code>, jamais synchronisé). Voir <code>.cred</code> pour les vraies valeurs.</p>

  <div class="card">
    <h3>Secret</h3>
    <div class="row">
      <label style="flex:2">
        Token Zammad
        <input id="tokenInput" type="password" placeholder="Token (stocké via setSecret)" />
      </label>
      <button id="saveToken" class="btn-primary">Enregistrer</button>
    </div>
    <div class="row">
      <button id="checkSecret">Vérifier secret</button>
      <button id="clearSecret">Effacer</button>
    </div>
    <p id="secretStatus" class="muted">—</p>
  </div>

  <div class="card">
    <h3>Connexion</h3>
    <div class="row">
      <button id="testConnection" class="btn-primary">Tester la connexion</button>
      <button id="showConfig">Voir config</button>
    </div>
    <p id="connStatus" class="muted">—</p>
  </div>

  <div class="card">
    <h3>Synchro</h3>
    <p class="muted">Dernier sync (persistDataSynced) + hook <code>persistedDataChanged</code> — Phase 1.</p>
    <p id="lastSync" class="muted">—</p>
    <button id="loadSync">Charger</button>
    <button id="saveSync">Sauver now</button>
  </div>

  <div class="card">
    <h3>Journaux</h3>
    <div id="log"></div>
    <button id="clearLog">Effacer</button>
  </div>

  <!-- Inlined JS — must be self-contained per plugin-development.md -->
  <script>
    const logEl = document.getElementById('log');
    const log = (...a) => {
      const line = a.map(v => typeof v === 'string' ? v : JSON.stringify(v)).join(' ');
      console.log('[Zammad SPsync iframe]', ...a);
      logEl.textContent += line + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    };

    // i18n helper (Phase 0 EN+FR — manifest i18n)
    const _t = (k, fb) => { try { return PluginAPI.translate(k) || fb; } catch { return fb; } };

    PluginAPI.onReady(() => log('iframe onReady', new Date().toISOString()));

    // Secret — local-only
    document.getElementById('saveToken').addEventListener('click', async () => {
      const v = document.getElementById('tokenInput').value.trim();
      if (!v) return log('Token vide');
      try {
        await PluginAPI.setSecret('zammadToken', v);
        document.getElementById('tokenInput').value = '';
        document.getElementById('secretStatus').textContent = 'Token enregistré (local-only)';
        log('setSecret ok');
        PluginAPI.showSnack({ msg: 'Token enregistré (local-only)', type: 'SUCCESS' });
      } catch (e) { log('setSecret err', e.message); }
    });
    document.getElementById('checkSecret').addEventListener('click', async () => {
      try {
        const s = await PluginAPI.getSecret('zammadToken');
        document.getElementById('secretStatus').textContent = s ? 'Secret présent (longueur ' + s.length + ')' : 'Aucun secret';
        log('getSecret', !!s);
      } catch (e) { log('getSecret err', e.message); }
    });
    document.getElementById('clearSecret').addEventListener('click', async () => {
      try { await PluginAPI.deleteSecret('zammadToken'); document.getElementById('secretStatus').textContent = 'Secret effacé'; log('deleteSecret ok'); } catch(e){ log(e.message) }
    });

    // Config & connection (uses PluginAPI.getConfig if available, else fallback)
    document.getElementById('showConfig').addEventListener('click', async () => {
      try {
        // issueProvider config is managed by SP — we read it via getConfig if exposed
        const cfg = typeof PluginAPI.getConfig === 'function' ? await PluginAPI.getConfig() : null;
        log('config', cfg);
        document.getElementById('connStatus').textContent = cfg ? JSON.stringify(cfg, null, 2) : 'getConfig non exposé en iframe (voir plugin.js)';
      } catch(e){ log('getConfig err', e.message) }
    });
    document.getElementById('testConnection').addEventListener('click', async () => {
      log('testConnection — voir aussi plugin.js:testConnection');
      document.getElementById('connStatus').textContent = 'Voir logs plugin.js (F12) + Issue Panel';
      PluginAPI.showSnack({ msg: 'Vérifiez F12 et le panneau Issues', type: 'INFO' });
    });

    // persistDataSynced demo — Phase 0
    document.getElementById('loadSync').addEventListener('click', async () => {
      try {
        const d = await PluginAPI.loadSyncedData();
        document.getElementById('lastSync').textContent = d || '(vide)';
        log('loadSyncedData', d);
      } catch(e){ log(e.message) }
    });
    document.getElementById('saveSync').addEventListener('click', async () => {
      try {
        const payload = JSON.stringify({ lastSyncAt: new Date().toISOString(), ver: '0.1.5' });
        await PluginAPI.persistDataSynced(payload);
        document.getElementById('lastSync').textContent = payload;
        log('persistDataSynced', payload);
      } catch(e){ log(e.message) }
    });

    document.getElementById('clearLog').addEventListener('click', () => logEl.textContent = '');

    log('index.html loaded — Phase 0 scaffold 0.1.5');
  </script>
</body>
</html>
